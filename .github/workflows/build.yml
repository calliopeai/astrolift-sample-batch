name: Build and Publish Sample Image

# Builds the astrolift-sample-batch fixture image (spec 42, R6) and pushes it
# to Docker Hub. Mirrors astrolift-agents/.github/workflows/build-images.yml:
# docker/login-action@v3 with the org-level DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# secrets (visibility=ALL, inherited by all calliopeai repos). Deterministic
# main-<sha7> tags for deploy, plus latest (spec 42 §3.2 / B3).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  NAMESPACE: calliopeai
  IMAGE: astrolift-sample-batch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          echo "sha=main-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "push=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg "GIT_SHA=${{ steps.tags.outputs.sha }}" \
            --build-arg "BUILT_AT=${{ steps.tags.outputs.built_at }}" \
            -t "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:${{ steps.tags.outputs.sha }}" \
            -t "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:latest" \
            .

      - name: Push tags (Docker Hub)
        if: steps.tags.outputs.push == 'true'
        run: |
          for tag in "${{ steps.tags.outputs.sha }}" latest; do
            docker push "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:${tag}"
          done
